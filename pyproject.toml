[project]
name = "windx-tracking-events"
version = "0.1.0"
description = "Ereignisdiskrete Simulation des Rotorblatt-Transports vom Produzenten zum Hafen, mit EDI- und EPCIS-Tracking-Events"
requires-python = ">=3.10"
dependencies = [
    "basyx-python-sdk>=2.1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
